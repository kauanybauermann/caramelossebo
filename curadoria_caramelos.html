<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curadoria - Caramelos</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    body { background-color: #f0ebdd; font-family: ui-sans-serif, system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #c2bba8; border-radius: 10px; border: 2px solid #f0ebdd; }
    ::-webkit-scrollbar-thumb:hover { background: #a39c89; }
  </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row text-[#404a3a] p-4 md:p-6 gap-6">

  <!-- Sidebar Verde e Aconchegante -->
  <aside class="w-full md:w-72 flex flex-col gap-4">
    
    <!-- Nova Logo: Cachorro Caramelo -->
    <div class="bg-[#4c5c44] rounded-[2.5rem] p-8 shadow-md flex flex-col items-center justify-center gap-3 relative overflow-hidden border-4 border-[#e6e1d1]">
      <img src="download (3).jpg" alt="Cachorro Caramelo" class="w-28 h-28 object-contain drop-shadow-xl z-10" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3204/3204646.png'">
      <h1 class="font-extrabold text-2xl text-[#f1ece1] z-10 text-center leading-tight tracking-wide">Caramelos</h1>
    </div>

    <!-- Menu de Navegação -->
    <nav class="flex flex-col gap-2 bg-[#4c5c44] p-4 rounded-[2.5rem] shadow-md border border-[#3d4a37]" id="menu-abas">
      <button onclick="mudarAba('todas')" class="aba-btn text-left px-5 py-3.5 rounded-full font-bold transition-all bg-[#f1ece1] text-[#4c5c44] shadow-sm" data-id="todas">Todas as Curadorias</button>
      <button onclick="mudarAba('a_fazer')" class="aba-btn text-left px-5 py-3.5 rounded-full font-medium transition-all text-[#b3bea9] hover:bg-[#5d6e55] hover:text-[#f1ece1]" data-id="a_fazer">A Fazer</button>
      <button onclick="mudarAba('com_valor_final')" class="aba-btn text-left px-5 py-3.5 rounded-full font-medium transition-all text-[#b3bea9] hover:bg-[#5d6e55] hover:text-[#f1ece1]" data-id="com_valor_final">Com Valor Final</button>
      <button onclick="mudarAba('falta_valor_final')" class="aba-btn text-left px-5 py-3.5 rounded-full font-medium transition-all text-[#b3bea9] hover:bg-[#5d6e55] hover:text-[#f1ece1]" data-id="falta_valor_final">Falta Valor Final</button>
      
      <!-- CONTADOR DE LIVROS (NOVIDADE) -->
      <div class="mt-3 bg-[#3d4a37] rounded-[1.8rem] p-5 shadow-inner border border-[#5d6e55] flex flex-col gap-1">
        <p class="text-[10px] font-extrabold text-[#9dae95] uppercase tracking-widest mb-1">Acervo do Sebo</p>
        <div class="flex items-end gap-1.5">
          <span class="text-4xl font-black text-[#f1ece1] leading-none tracking-tight" id="contador-livros">0</span>
          <span class="text-xs font-bold text-[#9dae95] mb-1">/ 10000</span>
        </div>
        <div class="w-full bg-[#2c3628] rounded-full h-2.5 mt-3 overflow-hidden shadow-inner">
          <div id="barra-progresso" class="bg-[#cf9a5b] h-2.5 rounded-full transition-all duration-1000" style="width: 0%"></div>
        </div>
      </div>
    </nav>
  </aside>

  <!-- Conteúdo Central -->
  <main class="flex-1 flex flex-col gap-6">
    <!-- Barra Superior -->
    <div class="flex flex-col xl:flex-row gap-4 justify-between items-center bg-[#f9f6ef] p-4 rounded-full shadow-sm border-2 border-[#e6e1d1] px-6">
      <div class="flex w-full xl:w-auto items-center gap-4">
        <div class="relative w-full xl:w-80">
          <i data-lucide="search" class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-[#8c9484]"></i>
          <input type="text" id="busca-texto" placeholder="Buscar livros..." oninput="renderizarLivros()" class="w-full bg-[#f0ebdd] border-none rounded-full py-3 pl-12 pr-4 text-sm focus:ring-2 focus:ring-[#cf9a5b] outline-none text-[#404a3a] font-medium placeholder-[#8c9484]">
        </div>
        <div class="relative flex items-center">
          <input type="date" id="busca-data" onchange="renderizarLivros()" class="bg-[#f0ebdd] border-none rounded-full py-3 px-4 text-sm focus:ring-2 focus:ring-[#cf9a5b] outline-none text-[#5c6655] font-medium cursor-pointer">
          <button onclick="limparData()" class="absolute right-3 text-[#8c9484] hover:text-[#a86161] hidden" id="btn-limpar-data"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        
        <button id="btn-ordem" onclick="alternarOrdem()" class="flex items-center gap-2 bg-[#f0ebdd] px-4 py-3 rounded-full text-sm font-bold text-[#5c6655] hover:bg-[#e3dcc3] transition-colors shadow-sm" title="Ordem A-Z">
          <i data-lucide="arrow-down-a-z" class="w-4 h-4"></i>
        </button>
      </div>
      
      <!-- Botão Cor Caramelo -->
      <button onclick="abrirModal()" class="w-full xl:w-auto bg-[#cf9a5b] text-white px-8 py-3 rounded-full font-bold shadow-md hover:bg-[#b8854c] transition-colors flex items-center justify-center gap-2 border border-[#b8854c]">
        <i data-lucide="plus" class="w-5 h-5"></i> Nova Curadoria
      </button>
    </div>

    <!-- Grade de Livros -->
    <div id="grid-livros" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6 pb-10"></div>
  </main>

  <!-- Modal Ampliar Imagem -->
  <div id="modal-imagem" class="fixed inset-0 bg-[#2c3628]/90 backdrop-blur-sm z-[60] flex items-center justify-center p-4 cursor-pointer hidden" onclick="fecharImagem()">
    <button class="absolute top-6 right-6 text-[#f1ece1] bg-[#4c5c44]/50 p-2 rounded-full hover:bg-[#a86161] transition-colors border border-[#f1ece1]/20">
      <i data-lucide="x" class="w-8 h-8"></i>
    </button>
    <img id="img-ampliada" src="" alt="Capa Ampliada" class="max-w-full max-h-[90vh] object-contain rounded-3xl shadow-2xl border-4 border-[#f9f6ef] cursor-default" onclick="event.stopPropagation()">
  </div>

  <!-- Modal Formulário -->
  <div id="modal-form" class="fixed inset-0 bg-[#2c3628]/60 backdrop-blur-sm z-50 flex items-center justify-end hidden">
    <div class="bg-[#f9f6ef] w-full md:w-[500px] h-full shadow-2xl flex flex-col relative border-l-4 border-[#4c5c44]">
      <div class="p-6 border-b-2 border-[#e6e1d1] flex justify-between items-center bg-[#f0ebdd]">
        <h2 id="modal-titulo" class="text-xl font-extrabold text-[#4c5c44]">Nova Curadoria</h2>
        <button onclick="fecharModal()" class="p-2 text-[#7a8575] hover:bg-[#e6e1d1] rounded-full transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="form-livro" onsubmit="salvarLivro(event)" class="p-6 overflow-y-auto flex-1 space-y-5">
        <input type="hidden" id="form-id">
        <input type="hidden" id="form-postado" value="false">
        
        <div class="flex gap-4 items-end">
          <div class="w-32 h-40 bg-white border-2 border-dashed border-[#c2bba8] rounded-2xl flex flex-col items-center justify-center overflow-hidden relative group shadow-sm hover:border-[#cf9a5b] transition-colors">
            <img id="form-preview-img" src="" class="w-full h-full object-cover hidden">
            <div id="form-placeholder-img" class="text-center p-2 text-[#8c9484]">
              <i data-lucide="image" class="w-8 h-8 mx-auto mb-1 opacity-60"></i>
              <span class="text-[10px] font-bold uppercase tracking-wide">Add Foto</span>
            </div>
            <input type="file" id="form-imagem-upload" accept="image/*" onchange="carregarImagem(event)" class="absolute inset-0 opacity-0 cursor-pointer">
            <input type="hidden" id="form-imagem-base64">
          </div>
          <div class="flex-1 space-y-4">
            <div>
              <label class="text-[10px] font-extrabold text-[#7a8575] uppercase tracking-widest ml-2">Título</label>
              <input required type="text" id="form-titulo" class="w-full mt-1 bg-white border-2 border-[#e6e1d1] rounded-xl p-3 focus:outline-none focus:ring-0 focus:border-[#cf9a5b] text-sm font-medium text-[#404a3a]">
            </div>
            <div>
              <label class="text-[10px] font-extrabold text-[#7a8575] uppercase tracking-widest ml-2">Autor</label>
              <input required type="text" id="form-autor" class="w-full mt-1 bg-white border-2 border-[#e6e1d1] rounded-xl p-3 focus:outline-none focus:ring-0 focus:border-[#cf9a5b] text-sm font-medium text-[#404a3a]">
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-[10px] font-extrabold text-[#7a8575] uppercase tracking-widest ml-2">Capa</label>
            <select id="form-capa" class="w-full mt-1 bg-white border-2 border-[#e6e1d1] rounded-xl p-3 focus:outline-none focus:ring-0 focus:border-[#cf9a5b] text-sm font-medium text-[#404a3a]">
              <option>Brochura</option><option>Capa Dura</option><option>Espiral</option>
            </select>
          </div>
          <div>
            <label class="text-[10px] font-extrabold text-[#7a8575] uppercase tracking-widest ml-2">Estado</label>
            <input type="text" id="form-estado" class="w-full mt-1 bg-white border-2 border-[#e6e1d1] rounded-xl p-3 focus:outline-none focus:ring-0 focus:border-[#cf9a5b] text-sm font-medium text-[#404a3a]">
          </div>
          <div>
            <label class="text-[10px] font-extrabold text-[#7a8575] uppercase tracking-widest ml-2">Valor Sugerido</label>
            <input type="text" id="form-valorSugerido" placeholder="R$ 0,00" class="w-full mt-1 bg-white border-2 border-[#e6e1d1] rounded-xl p-3 focus:outline-none focus:ring-0 focus:border-[#cf9a5b] text-sm font-medium text-[#404a3a]">
          </div>
          <div>
            <label class="text-[10px] font-extrabold text-[#7a8575] uppercase tracking-widest ml-2">Valor Final</label>
            <input type="text" id="form-valorFinal" placeholder="R$ 0,00" class="w-full mt-1 bg-white border-2 border-[#e6e1d1] rounded-xl p-3 focus:outline-none focus:ring-0 focus:border-[#cf9a5b] text-sm font-medium text-[#404a3a]">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-[10px] font-extrabold text-[#7a8575] uppercase tracking-widest ml-2">Data Curadoria</label>
            <input type="date" id="form-dataCuradoria" class="w-full mt-1 bg-white border-2 border-[#e6e1d1] rounded-xl p-3 focus:outline-none focus:ring-0 focus:border-[#cf9a5b] text-sm font-medium text-[#404a3a]">
          </div>
          <div>
            <label class="text-[10px] font-extrabold text-[#7a8575] uppercase tracking-widest ml-2">Status</label>
            <select id="form-status" class="w-full mt-1 bg-white border-2 border-[#e6e1d1] rounded-xl p-3 focus:outline-none focus:ring-0 focus:border-[#cf9a5b] text-sm font-bold text-[#404a3a]">
              <option value="a_fazer">A Fazer</option>
              <option value="com_valor_final">Com Valor Final</option>
              <option value="falta_valor_final">Falta Valor Final</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-[10px] font-extrabold text-[#7a8575] uppercase tracking-widest ml-2 flex items-center justify-between">Rascunho de Postagem</label>
          <textarea id="form-textoPostagem" rows="4" placeholder="Escreva aqui o texto que será usado para divulgar o livro..." class="w-full mt-1 bg-white border-2 border-[#e6e1d1] rounded-2xl p-4 focus:outline-none focus:ring-0 focus:border-[#cf9a5b] text-sm font-medium text-[#404a3a] resize-none"></textarea>
        </div>

        <button id="btn-salvar" type="submit" class="w-full bg-[#4c5c44] text-[#f1ece1] py-4 rounded-full font-bold hover:bg-[#3d4a37] transition-colors mt-4 border border-[#2c3628] shadow-md">
          Salvar Curadoria
        </button>
      </form>
    </div>
  </div>

  <script>
    // As chaves da sua base de dados do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBP-L894w1jPvDVqnOesqfx4rklNqRJpJo",
      authDomain: "sebo-caramelos.firebaseapp.com",
      projectId: "sebo-caramelos",
      storageBucket: "sebo-caramelos.firebasestorage.app",
      messagingSenderId: "746285334645",
      appId: "1:746285334645:web:e72762a2f44c752d6f383c",
      measurementId: "G-Y4VK0CVKPN"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let livrosGlobais = [];
    let abaAtiva = 'todas';
    let ordenacao = 'a_z';

    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
        document.getElementById('form-dataCuradoria').value = new Date().toISOString().split('T')[0];
        
        // Ativar escuta em tempo real
        db.collection("livros").onSnapshot((snapshot) => {
            livrosGlobais = [];
            snapshot.forEach((doc) => {
                livrosGlobais.push({ id: doc.id, ...doc.data() });
            });
            
            // ATUALIZA O CONTADOR E A BARRA DE PROGRESSO
            const total = livrosGlobais.length;
            document.getElementById('contador-livros').innerText = total;
            const progresso = Math.min(100, (total / 10000) * 100);
            document.getElementById('barra-progresso').style.width = progresso + '%';

            renderizarLivros();
        });
    });

    function mudarAba(aba) {
        abaAtiva = aba;
        document.getElementById('busca-data').value = '';
        document.querySelectorAll('.aba-btn').forEach(btn => {
            if(btn.dataset.id === aba) {
                btn.className = "aba-btn text-left px-5 py-3.5 rounded-full font-bold transition-all bg-[#f1ece1] text-[#4c5c44] shadow-sm";
            } else {
                btn.className = "aba-btn text-left px-5 py-3.5 rounded-full font-medium transition-all text-[#b3bea9] hover:bg-[#5d6e55] hover:text-[#f1ece1]";
            }
        });
        renderizarLivros();
    }

    function alternarOrdem() {
        ordenacao = ordenacao === 'a_z' ? 'z_a' : 'a_z';
        const btn = document.getElementById('btn-ordem');
        
        if(ordenacao === 'a_z') {
            btn.innerHTML = `<i data-lucide="arrow-down-a-z" class="w-4 h-4"></i>`;
            btn.title = "Ordem A-Z";
        } else {
            btn.innerHTML = `<i data-lucide="arrow-up-a-z" class="w-4 h-4"></i>`;
            btn.title = "Ordem Z-A";
        }
        
        lucide.createIcons();
        renderizarLivros();
    }

    function limparData() {
        document.getElementById('busca-data').value = '';
        renderizarLivros();
    }

    function editarLivro(id) { abrirModal(id); }

    function abrirModal(id = null) {
        document.getElementById('modal-form').classList.remove('hidden');
        if (id) {
            const livro = livrosGlobais.find(l => String(l.id) === String(id));
            if(!livro) return;
            document.getElementById('modal-titulo').innerText = 'Editar Curadoria';
            document.getElementById('form-id').value = livro.id;
            document.getElementById('form-titulo').value = livro.titulo;
            document.getElementById('form-autor').value = livro.autor;
            document.getElementById('form-capa').value = livro.capa;
            document.getElementById('form-estado').value = livro.estado;
            document.getElementById('form-valorSugerido').value = livro.valorSugerido;
            document.getElementById('form-valorFinal').value = livro.valorFinal;
            document.getElementById('form-dataCuradoria').value = livro.dataCuradoria;
            document.getElementById('form-status').value = livro.status;
            document.getElementById('form-textoPostagem').value = livro.textoPostagem || '';
            document.getElementById('form-postado').value = livro.postado;
            document.getElementById('form-imagem-base64').value = livro.imagem || '';
            
            if(livro.imagem) {
                document.getElementById('form-preview-img').src = livro.imagem;
                document.getElementById('form-preview-img').classList.remove('hidden');
                document.getElementById('form-placeholder-img').classList.add('hidden');
            } else {
                document.getElementById('form-preview-img').src = '';
                document.getElementById('form-preview-img').classList.add('hidden');
                document.getElementById('form-placeholder-img').classList.remove('hidden');
            }
        } else {
            document.getElementById('form-livro').reset();
            document.getElementById('modal-titulo').innerText = 'Nova Curadoria';
            document.getElementById('form-id').value = '';
            document.getElementById('form-imagem-base64').value = '';
            document.getElementById('form-postado').value = 'false';
            document.getElementById('form-preview-img').classList.add('hidden');
            document.getElementById('form-placeholder-img').classList.remove('hidden');
            document.getElementById('form-dataCuradoria').value = new Date().toISOString().split('T')[0];
        }
    }

    function fecharModal() {
        document.getElementById('modal-form').classList.add('hidden');
    }

    function carregarImagem(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6);

                    document.getElementById('form-imagem-base64').value = dataUrl;
                    document.getElementById('form-preview-img').src = dataUrl;
                    document.getElementById('form-preview-img').classList.remove('hidden');
                    document.getElementById('form-placeholder-img').classList.add('hidden');
                };
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }
    }

    async function salvarLivro(event) {
        event.preventDefault();
        
        const btnSalvar = document.getElementById('btn-salvar');
        btnSalvar.innerText = 'A guardar...';
        btnSalvar.disabled = true;

        const id = document.getElementById('form-id').value;
        const titulo = document.getElementById('form-titulo').value.trim();
        
        const livroDuplicado = livrosGlobais.some(l => l.titulo.toLowerCase() === titulo.toLowerCase() && String(l.id) !== String(id));
        if (livroDuplicado) {
            alert("ATENÇÃO: Este livro já passou por curadoria e está no sistema. Não processe títulos repetidos.");
            btnSalvar.innerText = 'Salvar Curadoria';
            btnSalvar.disabled = false;
            return;
        }

        const dadosLivro = {
            titulo: titulo,
            autor: document.getElementById('form-autor').value,
            capa: document.getElementById('form-capa').value,
            estado: document.getElementById('form-estado').value,
            valorSugerido: document.getElementById('form-valorSugerido').value,
            valorFinal: document.getElementById('form-valorFinal').value,
            dataCuradoria: document.getElementById('form-dataCuradoria').value,
            status: document.getElementById('form-status').value,
            textoPostagem: document.getElementById('form-textoPostagem').value,
            postado: document.getElementById('form-postado').value === 'true',
            imagem: document.getElementById('form-imagem-base64').value
        };

        try {
            if (id) {
                await db.collection("livros").doc(id).update(dadosLivro);
            } else {
                dadosLivro.timestampCriacao = Date.now();
                await db.collection("livros").add(dadosLivro);
            }
            fecharModal();
        } catch (error) {
            console.error("Erro ao guardar: ", error);
            alert("Erro ao guardar. Verifique se o Firebase está bem configurado.");
        } finally {
            btnSalvar.innerText = 'Salvar Curadoria';
            btnSalvar.disabled = false;
        }
    }

    async function excluirLivro(id) {
        if(confirm("Tem a certeza que deseja remover esta curadoria? Ela será apagada para toda a equipa!")) {
            try {
                await db.collection("livros").doc(id).delete();
            } catch (error) {
                console.error("Erro ao apagar: ", error);
            }
        }
    }

    async function alternarPostado(id) {
        const livro = livrosGlobais.find(l => String(l.id) === String(id));
        if(livro) {
            try {
                await db.collection("livros").doc(id).update({ postado: !livro.postado });
            } catch (error) {
                console.error("Erro ao atualizar postagem: ", error);
            }
        }
    }

    function copiarTexto(id) {
        const livro = livrosGlobais.find(l => String(l.id) === String(id));
        if(livro && livro.textoPostagem && livro.textoPostagem.trim() !== '') {
            navigator.clipboard.writeText(livro.textoPostagem)
                .then(() => alert("Rascunho copiado para a área de transferência!"))
                .catch(() => alert("Erro ao copiar o texto."));
        } else {
            alert("Este livro não possui rascunho de postagem para copiar.");
        }
    }

    function abrirImagem(base64) {
        if(!base64) return;
        document.getElementById('img-ampliada').src = base64;
        document.getElementById('modal-imagem').classList.remove('hidden');
    }

    function fecharImagem() {
        document.getElementById('modal-imagem').classList.add('hidden');
    }

    function renderizarLivros() {
        const grid = document.getElementById('grid-livros');
        const buscaTexto = document.getElementById('busca-texto').value.toLowerCase();
        const buscaData = document.getElementById('busca-data').value;
        
        document.getElementById('btn-limpar-data').classList.toggle('hidden', buscaData === '');

        let filtrados = livrosGlobais.filter(livro => {
            const matchBusca = livro.titulo.toLowerCase().includes(buscaTexto) || livro.autor.toLowerCase().includes(buscaTexto);
            const matchAba = abaAtiva === 'todas' || livro.status === abaAtiva;
            const matchData = buscaData === '' || livro.dataCuradoria === buscaData;
            return matchBusca && matchAba && matchData;
        });

        filtrados.sort((a, b) => {
            if (ordenacao === 'a_z') {
                return a.titulo.localeCompare(b.titulo);
            } else {
                return b.titulo.localeCompare(a.titulo);
            }
        });

        if (filtrados.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center py-20 text-[#8c9484] font-medium"><p>Nenhum livro encontrado com estes filtros na floresta.</p></div>`;
            return;
        }

        let html = '';
        filtrados.forEach(livro => {
            // Cores baseadas no novo tema terroso
            let statusCor = livro.status === 'a_fazer' ? 'text-[#a06a44] bg-[#f8ecd9] border-[#e6d1bc]' : livro.status === 'com_valor_final' ? 'text-[#5a8055] bg-[#e3ebd9] border-[#c4d4ba]' : 'text-[#a85c5c] bg-[#fae3e3] border-[#e6c3c3]';
            let statusLabel = livro.status === 'a_fazer' ? 'A FAZER' : livro.status === 'com_valor_final' ? 'COM VALOR FINAL' : 'FALTA VALOR FINAL';
            const dataFormatada = livro.dataCuradoria.split('-').reverse().join('/');
            
            const btnPostadoClass = livro.postado ? 'bg-[#dce6d5] border-[#c4d4ba] text-[#4c5c44]' : 'bg-white border-[#e6e1d1] text-[#8c9484] hover:bg-[#f0ebdd]';
            const iconePostado = livro.postado ? 'check-square' : 'square';
            const imagemHtml = livro.imagem ? `<img src="${livro.imagem}" class="w-full h-full object-cover" />` : `<i data-lucide="image" class="w-8 h-8 text-[#c2bba8]"></i>`;

            html += `
            <div class="bg-[#f9f6ef] rounded-[2rem] p-5 shadow-sm border-2 border-[#e6e1d1] hover:border-[#cf9a5b] transition-all flex flex-col gap-5 relative group">
                <div class="flex gap-4 items-start">
                  <div onclick="abrirImagem('${livro.imagem || ''}')" class="w-24 h-32 bg-white rounded-2xl overflow-hidden flex-shrink-0 cursor-pointer border-2 border-[#e6e1d1] flex items-center justify-center shadow-sm hover:opacity-80 transition-opacity">
                    ${imagemHtml}
                  </div>
                  <div class="flex flex-col items-start gap-2 pt-1 overflow-hidden">
                    <h3 class="font-bold text-[#404a3a] leading-tight text-lg w-full truncate" title="${livro.titulo}">${livro.titulo}</h3>
                    <p class="text-[#7a8575] text-sm font-medium w-full truncate">${livro.autor}</p>
                    <div class="flex flex-col items-start gap-1.5 mt-1">
                      <span class="text-[10px] font-extrabold px-3 py-1.5 rounded-full border ${statusCor} tracking-wide">${statusLabel}</span>
                      <span class="text-[11px] font-bold px-3 py-1.5 bg-[#f0ebdd] text-[#7a8575] rounded-full border border-[#e6e1d1]">${dataFormatada}</span>
                    </div>
                  </div>
                </div>
                
                <div class="bg-white rounded-[1.5rem] p-4 flex justify-between border-2 border-[#e6e1d1]">
                  <div class="flex flex-col gap-1 text-sm text-[#5c6655] justify-center font-medium">
                    <p><span class="font-bold text-[#8c9484]">Capa:</span> ${livro.capa}</p>
                    <p><span class="font-bold text-[#8c9484]">Estado:</span> ${livro.estado}</p>
                  </div>
                  <div class="w-0.5 bg-[#e6e1d1] mx-2 rounded-full"></div>
                  <div class="flex flex-col gap-2 text-right justify-center min-w-[100px]">
                    <div>
                      <p class="text-[9px] font-extrabold text-[#cf9a5b] uppercase tracking-widest">Valor Sugerido</p>
                      <p class="font-black text-[#404a3a]">${livro.valorSugerido || '-'}</p>
                    </div>
                    <div>
                      <p class="text-[9px] font-extrabold text-[#5a8055] uppercase tracking-widest">Valor Final</p>
                      <p class="font-black text-[#404a3a]">${livro.valorFinal || '-'}</p>
                    </div>
                  </div>
                </div>
                
                <div class="flex items-center justify-between pt-1">
                  <button onclick="alternarPostado('${livro.id}')" class="flex items-center gap-2 px-4 py-2.5 rounded-full border-2 transition-all shadow-sm ${btnPostadoClass}">
                    <i data-lucide="${iconePostado}" class="w-4 h-4"></i>
                    <span class="text-[11px] font-extrabold tracking-wide">POSTADO</span>
                  </button>
                  <div class="flex items-center gap-2">
                    <button onclick="copiarTexto('${livro.id}')" class="w-10 h-10 rounded-full border-2 border-[#e6e1d1] flex items-center justify-center text-[#8c9484] hover:text-[#cf9a5b] hover:border-[#cf9a5b] hover:bg-[#f9f6ef] transition-all bg-white shadow-sm" title="Copiar Rascunho"><i data-lucide="copy" class="w-4 h-4"></i></button>
                    <button onclick="editarLivro('${livro.id}')" class="w-10 h-10 rounded-full border-2 border-[#e6e1d1] flex items-center justify-center text-[#8c9484] hover:text-[#5a8055] hover:border-[#5a8055] hover:bg-[#f9f6ef] transition-all bg-white shadow-sm" title="Editar"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                    <button onclick="excluirLivro('${livro.id}')" class="w-10 h-10 rounded-full border-2 border-[#e6e1d1] flex items-center justify-center text-[#8c9484] hover:text-[#a86161] hover:border-[#a86161] hover:bg-[#f9f6ef] transition-all bg-white shadow-sm" title="Remover"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                  </div>
                </div>
            </div>`;
        });
        grid.innerHTML = html;
        lucide.createIcons();
    }
  </script>
</body>
</html>
